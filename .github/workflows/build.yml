name: Build Cloud Companion APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="CloudCompanion_v2_64bit.zip"
          if [ ! -f "$ZIP" ]; then ZIP=$(ls -t *.zip | head -n 1); fi
          echo "Using $ZIP"
          rm -rf project && mkdir project
          unzip -q "$ZIP" -d project
          if [ ! -f project/settings.gradle.kts ]; then
            D=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
            mv "$D" project_root && rm -rf project && mv project_root project
          fi
          ls project

      - name: Get official Nabto 4 client SDK (64-bit)
        uses: actions/checkout@v4
        with:
          repository: nabto/android-client-api
          ref: 8b29e4170a384850f0a4c91f81c89a017ddebb8a
          path: project/nabto-sdk
          lfs: true

      - name: Verify Nabto native libraries
        run: |
          file project/nabto-sdk/src/main/jniLibs/arm64-v8a/libnabto_client_api_jni.so
          file project/nabto-sdk/src/main/jniLibs/arm64-v8a/libnabto_client_api_jni.so | grep -q "ELF 64-bit"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudCompanion-APK
          path: project/app/build/outputs/apk/debug/*.apk
